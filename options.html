<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Label Highlighter for Plane</title>
  <style>
    body { font: 14px system-ui, sans-serif; color: #111827; background: #f9fafb; margin: 0; padding: 32px 16px; }
    main { max-width: 560px; margin: 0 auto; }
    section { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 18px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 18px; }
    h2 { font-size: 15px; margin: 0 0 4px; }
    p.hint { margin: 0 0 12px; color: #6b7280; font-size: 13px; }
    .row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .row input[type=text] { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px; font: inherit; }
    .row input[type=color] { width: 34px; height: 30px; padding: 0; border: 1px solid #d1d5db; border-radius: 4px; background: none; }
    .head { color: #6b7280; font-size: 11px; }
    .head span:first-child { flex: 1; }
    .head span:not(:first-child) { width: 34px; text-align: center; }
    .head .gap { width: 30px; }
    button { font: inherit; padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 4px; background: #fff; cursor: pointer; }
    button.del { width: 30px; padding: 6px 0; color: #b91c1c; }
    button.primary { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
    .site { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
    .site code { font-size: 13px; }
    .bar { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    label.check { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
  </style>
</head>
<body>
<main>
  <h1>Label Highlighter for Plane</h1>

  <section>
    <h2>Labels</h2>
    <p class="hint">Type each label name exactly as it appears in Plane (case doesn't matter).</p>
    <div class="row head"><span>Label name</span><span>Fill</span><span>Border</span><span class="gap"></span></div>
    <div id="rules"></div>
    <button id="add">+ Add label</button>
    <label class="check"><input type="checkbox" id="card"> Also highlight the whole card</label>
    <div class="bar"><button id="save" class="primary">Save</button><span id="status"></span></div>
  </section>

  <section>
    <h2>Sites</h2>
    <p class="hint">Works on app.plane.so already. Self-hosted Plane? Add its address; Chrome will ask you to allow it. Reload open board tabs afterwards.</p>
    <div id="sites"></div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="siteInput" placeholder="https://plane.example.com">
      <button id="addSite">Add site</button>
    </div>
    <span id="siteStatus"></span>
  </section>
</main>
<script src="defaults.js"></script>
<script src="options.js"></script>
</body>
</html>
